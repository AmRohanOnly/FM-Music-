<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow Behind Note -->
  <circle cx="256" cy="256" r="140" fill="#FFFFFF" opacity="0.06" filter="blur(35px)" />

  <!-- Eighth Note Glyph (Outline) matching user logo -->
  <g transform="translate(256, 256) scale(0.68) translate(-256, -256)" filter="url(#softGlow)">
    <path
      fill="#FFFFFF"
      fill-rule="evenodd"
      d="
        M 268,76
        C 268,76 278,110 305,138
        C 330,165 362,182 365,225
        C 367,254 355,268 350,271
        C 345,271 345,259 338,233
        C 328,199 301,175 283,161
        L 283,290
        C 276,285 264,280 247,277
        C 203,269 162,290 154,323
        C 146,356 175,388 219,396
        C 263,404 299,385 306,352
        C 309,340 307,326 302,313
        L 302,106
        C 302,91 300,76 268,76 Z
        
        M 229,301
        C 254,306 273,324 269,342
        C 265,360 239,371 214,367
        C 189,362 176,344 180,326
        C 184,308 204,297 229,301 Z
      "
    />
  </g>
</svg>
