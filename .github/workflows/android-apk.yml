name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate disposable debug signing key
        run: >-
          keytool -genkeypair -noprompt
          -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Package APK
        run: |
          mkdir -p packages
          cp app/build/outputs/apk/debug/app-debug.apk packages/FM-Music-debug.apk
          git rev-parse HEAD > packages/commit.txt
          cd packages
          sha256sum FM-Music-debug.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM-Music-debug-${{ github.sha }}
          path: packages/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
