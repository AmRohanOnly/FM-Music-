name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and build tools
        shell: bash
        run: |
          set +e
          (
            set -e
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            SDKMANAGER="$RUNNER_TEMP/android-tools/cmdline-tools/bin/sdkmanager"
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list --channel=3
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platforms;android-37' 'build-tools;37.0.0'
          ) 2>&1 | tee "$RUNNER_TEMP/android-sdk.log"
          sdk_status=${PIPESTATUS[0]}
          if [ "$sdk_status" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'android-sdk.log').read_text()[-18000:]
          escaped = log.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android SDK installation failure::{escaped}')
          PY
          fi
          exit "$sdk_status"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.8.2'
      - name: Generate disposable debug signing key
        run: >-
          keytool -genkeypair -noprompt
          -keystore debug.keystore -storepass android
          -alias androiddebugkey -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP']) / 'android-build.log').read_text()
          start = log.find('FAILURE:')
          details = log[max(0, start - 6000):] if start >= 0 else log[-12000:]
          details = details[:12000]
          escaped = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Android build failure::{escaped}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Android build failure\n\n```text\n' + details + '\n```\n')
          PY
          fi
          exit "$build_status"
      - name: Package APK
        run: |
          mkdir -p packages
          cp app/build/outputs/apk/debug/app-debug.apk packages/FM-Music-debug.apk
          git rev-parse HEAD > packages/commit.txt
          cd packages
          sha256sum FM-Music-debug.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM-Music-debug-${{ github.sha }}
          path: packages/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
